<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Profile | Link Saya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* CSS INTERNAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .profile-card {
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid #3f00ff;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(63, 0, 255, 0.4);
            backdrop-filter: blur(10px);
        }

        .profile-img img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #00d4ff;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #00d4ff;
            object-fit: cover;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #00d4ff;
            text-shadow: 2px 2px #3f00ff;
        }

        .bio {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            text-decoration: none;
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid transparent;
        }

        .link-card i {
            font-size: 1.2rem;
        }

        /* Hover Effects */
        .link-card:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        /* Warna Mengikut Jenama */
        .ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .tt { background: #000; border: 1px solid #fff; }
        .wa { background: #25d366; }
        .tg { background: #0088cc; }
        .yt { background: #ff0000; }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="profile-img">
                <img src="https://lh3.googleusercontent.com/d/1l0CcqCf6dR8XJ7kfJsxGc57YAz6bPfbp" alt="Profile Picture" id="avatar">
            </div>
            <h1>data SATRIYA</h1>
            <p class="bio">Digital Marketer | Tech Enthusiast | Gamer</p>

            <div class="social-links">
                <a href="https://www.instagram.com/satrio_qs?igsh=anpqbW9hdG9lMjJ6" target="_blank" class="link-card ig">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
                <a href="https://tiktok.com/@kesatria.rembulan" target="_blank" class="link-card tt">
                    <i class="fab fa-tiktok"></i> TikTok
                </a>
                <a href="https://wa.me/6281932475240" target="_blank" class="link-card wa">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://t.me/bulanbintang0" target="_blank" class="link-card tg">
                    <i class="fab fa-telegram"></i> Telegram
                </a>
                <a href="https://www.youtube.com/@clipercin" target="_blank" class="link-card yt">
                    <i class="fab fa-youtube"></i> YouTube
                </a>
            </div>
        </div>
    </div>

    <script>
        /* JAVASCRIPT INTERNAL */
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.link-card');

            // Animasi masuk satu demi satu
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 200 * index);
            });
        });
    </script>
</body>
</html>
